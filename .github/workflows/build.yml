name: Build and Deploy Plugins

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build all plugins
        run: ./gradlew makePluginsJson

      - name: Push to builds branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin builds || git checkout --orphan builds
          git checkout builds 2>/dev/null || (git checkout --orphan builds && git rm -rf .)
          cp -r build/plugins/* . 2>/dev/null || true
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: build plugins [skip ci]"
          git push origin builds --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
